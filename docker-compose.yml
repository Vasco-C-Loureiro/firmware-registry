services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://registry:registry@db:5432/registry
      STORAGE_DIR: /data/storage
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - firmware:/data/storage

volumes:
  pgdata:
  firmware:
